{% extends "main/_base.html" %}

{% block content %}

  <h1>{% block title %}Videos{% endblock %}</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    {% for each in videos %}
      <a class="video no-underline block group/blog border border-slate-200 bg-white rounded-2xl overflow-hidden flex flex-col justify-between hover:border-brand transition-all duration-150" href="/resources/videos/{{ each.id }}/">
        
        <div>
          {% if each.image %}
            <div class="w-full h-48 bg-slate-100 overflow-hidden relative border-b border-slate-100">
              <img src="{{ each.image.thumbnail.url }}" class="w-full h-full object-cover transition-transform duration-200 group-hover/blog:scale-105" alt="">
            </div>
            {% endif %}

          <div class="p-5 space-y-2">
            <h5 class="text-lg font-bold text-slate-900 group-hover/blog:text-brand transition-colors tracking-tight leading-snug line-clamp-2">
              {{ each }}
            </h5>
            <p class="text-sm text-slate-600 font-normal leading-relaxed line-clamp-3 pt-1">
              <span>
                {{ each.description|striptags|truncatewords:20 }}
              </span>
            </p>
          </div>
        </div>

        <div class="p-5 border-t border-slate-100 bg-slate-50/50 flex items-center justify-between">
          <span class="inline-flex items-center rounded-md bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 group-hover/blog:bg-brand/10 group-hover/blog:text-brand transition-colors tracking-wide uppercase">
            {{ each.date|date:"M d, Y" }}
          </span>
        </div>

      </a>
    {% endfor %}
  </div>

{% endblock %}
