{% extends "main/_base.html" %}

{% block content %}

<h1>
{% block title %}
  News
{% endblock %}
</h1>

<table class="table table-striped mb-2">
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Date</th>
    </tr>
  </thead>
  <tbody>
  {% for each in news %}
    <tr>
      <td class="font-mono text-slate-700">{{ each.id }}</td>
      <td><a href="{% url "controlpanel_news" each.id %}">{{ each }}</a></td>
      <td class="whitespace-nowrap">{{ each.date }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>

<a class="btn-add" href="{% url "controlpanel_news" %}"><i class="fa fa-plus mr-1"></i>Add article</a>

{% endblock %}
