{% extends "main/_base.html" %}

{% block content %}

<h1>{% block title %}Library{% endblock %}</h1>

<form method="post" enctype="multipart/form-data" class="space-y-8">

  {% csrf_token %}

  <div class="rounded-2xl border border-slate-200 bg-white overflow-hidden">
    <div class="border-b border-slate-200 px-6 py-5">
      <h2 class="text-xl font-bold tracking-tight text-slate-900">Basic information</h2>
    </div>

    <div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

      <div class="lg:col-span-2">
        <label class="block mb-2 text-sm font-semibold text-slate-700">Title</label>
        <input type="text" name="name" value="{{ info.name }}" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">
      </div>

      <div>
        <label class="block mb-2 text-sm font-semibold text-slate-700">Document type</label>
        <select name="type" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">
          {% for each in types %}
            <option value="{{ each.id }}"{% if each.id == info.type.id %} selected{% endif %}>{{ each }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block mb-2 text-sm font-semibold text-slate-700">Language</label>
        <select name="language" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">
          {% for value,label in info.LANGUAGES %}
            <option value="{{ value }}"{% if value == info.language %} selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="lg:col-span-2">
        <label class="block mb-2 text-sm font-semibold text-slate-700">Title in original language</label>
        <input type="text" name="title_original_language" value="{{ info.title_original_language }}" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">
      </div>

      <div class="lg:col-span-2">
        <label class="block mb-2 text-sm font-semibold text-slate-700">Authors</label>
        <textarea name="author_list" rows="3" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">{{ info.author_list }}</textarea>
      </div>

      <div class="lg:col-span-2">
        <label class="block mb-2 text-sm font-semibold text-slate-700">Description</label>
        <textarea name="description" rows="6" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">{{ info.description }}</textarea>
      </div>

    </div>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white overflow-hidden">
    <div class="border-b border-slate-200 px-6 py-5">
      <h2 class="text-xl font-bold tracking-tight text-slate-900">Publication details</h2>
    </div>

    <div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

      <div>
        <label class="block mb-2 text-sm font-semibold text-slate-700">Publication year</label>
        <input type="number" name="year" value="{{ info.year }}" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">
      </div>

      <div>
        <label class="block mb-2 text-sm font-semibold text-slate-700">License</label>
        <select name="license" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">
          <option value="">---------</option>
          {% for each in licenses %}
            <option value="{{ each.id }}"{% if info.license.id == each.id %} selected{% endif %}>{{ each }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block mb-2 text-sm font-semibold text-slate-700">DOI</label>
        <input type="text" name="doi" value="{{ info.doi }}" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">
      </div>

      <div>
        <label class="block mb-2 text-sm font-semibold text-slate-700">ISBN</label>
        <input type="text" name="isbn" value="{{ info.isbn }}" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">
      </div>

      <div class="lg:col-span-2">
        <label class="block mb-2 text-sm font-semibold text-slate-700">Metadata URL</label>
        <input type="url" name="url" value="{{ info.url }}" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">
      </div>

      <div class="lg:col-span-2">
        <label class="block mb-2 text-sm font-semibold text-slate-700">File download URL</label>
        <input type="url" name="file_url" value="{{ info.file_url }}" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">
      </div>

      <div class="lg:col-span-2">
        <label class="inline-flex items-center gap-3">
          <input type="checkbox" name="open_access" {% if info.open_access %}checked{% endif %} class="rounded border-slate-300 text-brand focus:ring-brand">
          <span class="text-sm font-medium text-slate-700">Open access publication</span>
        </label>
      </div>

    </div>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white overflow-hidden">
    <div class="border-b border-slate-200 px-6 py-5">
      <h2 class="text-xl font-bold tracking-tight text-slate-900">Files & relationships</h2>
    </div>

    <div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-8">

      <div>
        <label class="block mb-2 text-sm font-semibold text-slate-700">Featured image</label>

        {% if info.image %}
          <img src="{{ info.image.thumbnail.url }}" class="mb-4 w-40 rounded-xl border border-slate-200">
        {% endif %}

        <input type="file" name="image" class="block w-full text-sm">
      </div>

      <div>
        <label class="block mb-2 text-sm font-semibold text-slate-700">Document file</label>

        {% if info.file %}
          <p class="mb-3 text-sm text-slate-500">
            Current:
            <a href="{{ info.file.url }}" target="_blank" class="text-brand">{{ info.file.name }}</a>
          </p>
        {% endif %}

        <input type="file" name="file" class="block w-full text-sm">
      </div>

      <div>
        <label class="block mb-2 text-sm font-semibold text-slate-700">Related islands</label>

        <select name="spaces" multiple size="12" class="w-full rounded-xl border border-slate-300 px-3 py-3 focus:border-brand focus:ring-0">
          {% for each in islands %}
            <option value="{{ each.id }}"{% if each in info.spaces.all %} selected{% endif %}>{{ each }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block mb-2 text-sm font-semibold text-slate-700">Tags</label>

        <select name="tags" multiple size="12" class="w-full rounded-xl border border-slate-300 px-3 py-3 focus:border-brand focus:ring-0">
          {% for each in tags %}
            <option value="{{ each.id }}"{% if each in info.tags.all %} selected{% endif %}>{{ each }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="lg:col-span-2">
        <label class="block mb-2 text-sm font-semibold text-slate-700">Internal comments</label>
        <textarea name="comments" rows="5" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">{{ info.comments }}</textarea>
      </div>

    </div>
  </div>

  <div class="flex items-center justify-between">
    <a href="/controlpanel/library/" class="rounded-xl border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50 no-underline">
      Cancel
    </a>

    <button type="submit" class="rounded-xl bg-brand px-6 py-3 text-sm font-semibold text-white hover:opacity-90">
      <i class="fal fa-save mr-2"></i>
      Save record
    </button>
  </div>

</form>
{% endblock %}
