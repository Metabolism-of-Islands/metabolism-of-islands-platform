{% extends "main/_base.html" %}

{% block content %}

<form method="post" enctype="multipart/form-data" class="space-y-8">

  {% csrf_token %}

  <div class="rounded-2xl border border-slate-200 bg-white overflow-hidden">
    <div class="border-b border-slate-200 px-6 py-5">
      <h2 class="text-xl font-bold tracking-tight text-slate-900">{% block title %}{% if info %}Edit publisher{% else %}Add publisher{% endif %}{% endblock %}</h2>
    </div>

    <div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

      <div class="lg:col-span-2">
        <label class="block mb-2 text-sm font-semibold text-slate-700">Name</label>
        <input type="text" name="name" value="{{ info.name|default:'' }}" required class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-brand focus:ring-0">
      </div>

      <div class="lg:col-span-2">
        <label class="block mb-2 text-sm font-semibold text-slate-700">Image</label>
        {% if info.image %}
          <div class="mb-3 flex items-center space-x-4">
            <img src="{{ info.image.thumbnail.url }}" alt="Current Thumbnail" class="h-16 w-16 object-cover rounded-lg border border-slate-200">
            <span class="text-xs text-slate-500">Currently: <a href="{{ info.image.url }}" target="_blank" class="text-brand underline">View full size</a></span>
          </div>
        {% endif %}
        <input type="file" name="image" accept="image/*" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200">
      </div>

      <div class="lg:col-span-2">
        <label class="block mb-2 text-sm font-semibold text-slate-700">Description</label>
        
        <input type="hidden" name="description" id="hidden_description" value="{{ info.description|default:'' }}">
        
        <div id="editor_container" class="w-full rounded-b-xl border border-slate-300 bg-white" style="min-height: 200px;">
          {{ info.description|safe }}
        </div>
      </div>

    </div>
  </div>

  <!-- Form Actions -->
  <div class="flex flex-row-reverse items-center justify-between">
    <button type="submit" class="rounded-xl bg-brand px-6 py-3 text-sm font-semibold text-white hover:opacity-90">
      <i class="fal fa-save mr-2"></i>
      Save record
    </button>

    {% if info.id %}
      <button
        tabindex="-1"
        name="delete"
        value="true"
        type="submit"
        onclick="javascript:return confirm('Are you sure you want to remove this record?')"
        class="btn-red">
        <i class="fal fa-trash-alt mr-2"></i>
        Delete
      </button>
    {% endif %}

  </div>

</form>

{% endblock %}
