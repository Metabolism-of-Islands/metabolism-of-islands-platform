{% extends "main/_base.html" %}

{% block content %}

<h1>{% block title %}{{ info }}{% endblock %}</h1>

<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Added</th>
    </tr>
  </thead>
  <tbody>
  {% for each in items %}
    <tr>
      <td class="font-mono text-slate-600">{{ each.id }}</td>
      <td><a href="{% url "controlpanel_library_item" each.id %}">{{ each.name }}</a></td>
      <td class="whitespace-nowrap">{{ each.date_created|date:"M d, Y" }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>

{% endblock %}
