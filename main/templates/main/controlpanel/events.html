{% extends "main/_base.html" %}

{% block content %}

<h1>
{% block title %}
  Events
{% endblock %}
</h1>

<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Dates</th>
    </tr>
  </thead>
  <tbody>
  {% for each in events %}
    <tr>
      <td class="font-mono text-slate-700">{{ each.id }}</td>
      <td><a href="{% url "controlpanel_event" each.id %}">{{ each }}</a></td>
      <td class="whitespace-nowrap">{{ each.get_dates }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>

{% endblock %}
