{% extends "main/_base.html" %}

{% block title %}
  Publishers
{% endblock %}

{% block content %}

<a href="/library/" class="inline-flex items-center text-xs font-semibold uppercase tracking-wider text-slate-400 hover:text-brand !no-underline transition-colors">
  <i class="fa fa-arrow-left mr-2"></i> Back to library homepage
</a>

<h1 class="mt-5">Publishers</h1>

<div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden flex flex-col">
    <div class="bg-slate-50 px-4 py-2.5 border-b border-slate-200">
      <h3 class="mb-0 text-xs font-bold tracking-wider text-slate-700 uppercase">Top-20 publishers</h3>
    </div>
    <div class="p-4 flex-1">
      <ul class="space-y-2 text-sm">
        {% for each in publishers %}
          <li>
            <a href="{{ each.get_absolute_url }}" class="flex justify-between items-center text-slate-600 hover:text-brand !no-underline group">
              <span class="truncate pr-2">{{ each }}</span>
              <span class="text-xs font-mono text-slate-400 group-hover:text-brand">({{ each.total }})</span>
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>

{% endblock %}
